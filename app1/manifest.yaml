apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    purpose: app1
    project: roboshop
spec:
  replicas: 3
  selector:
    matchLabels:
      purpose: app1
      project: roboshop
  template:
    metadata:
      labels:
        purpose: app1
        project: roboshop
    spec:
      containers:
      - name: nginx
        image: mamidalahemanchandra/app1
---
apiVersion: v1
kind: Service
metadata:
  name: app1
spec:
  selector:
    purpose: app1
    project: roboshop
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:634758830486:certificate/9d467850-c1d1-4243-8838-fd67fa84630a
    # Redirect HTTP → HTTPS
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - host: "app1.heman.icu"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: app1
                port:
                  number: 80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    purpose: app2
    project: roboshop
spec:
  replicas: 3
  selector:
    matchLabels:
      purpose: app2
      project: roboshop
  template:
    metadata:
      labels:
        purpose: app2
        project: roboshop
    spec:
      containers:
      - name: nginx
        image: app2:v1
---
apiVersion: v1
kind: Service
metadata:
  name: app2
spec:
  selector:
    purpose: app2
    project: roboshop
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app2
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: alb
  rules:
    - host: "app2.heman.icu"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: app2
                port:
                  number: 80